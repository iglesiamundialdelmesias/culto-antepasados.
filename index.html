<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gestión de Cultos y Antepasados</title>
  <link rel="manifest" href="manifest.json">
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
    body { background-color: #eef7f6; min-height: 100vh; width: 100vw; overflow-x: hidden; font-size: 16px; }
    
    .phone-frame { 
      width: 100%; 
      min-height: 100vh; 
      background-color: #eef7f6; 
      padding: 16px; 
      padding-bottom: 110px; 
      position: relative; 
    }
    
    .title { text-align: center; font-size: 22px; color: #1a365d; margin-bottom: 18px; font-weight: bold; }
    .user-card { background-color: #ffffff; border-radius: 16px; padding: 16px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; box-shadow: 0 3px 10px rgba(0,0,0,0.06); border: 1px solid #cbd5e0; }
    .section-title { font-size: 15px; font-weight: bold; color: #2d3748; margin-bottom: 12px; text-transform: uppercase; margin-top: 18px; letter-spacing: 0.5px; }
    
    .card { background-color: #ffffff; border-radius: 18px; padding: 18px; margin-bottom: 16px; box-shadow: 0 3px 10px rgba(0,0,0,0.06); border: 1px solid #cbd5e0; }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
    .bold-text { font-weight: bold; font-size: 20px; color: #1a202c; margin-top: 6px; }
    
    .label { font-size: 14px; color: #4a5568; font-weight: 600; }
    .badge-yellow { background-color: #fefcbf; color: #744210; padding: 6px 12px; border-radius: 14px; font-size: 14px; font-weight: bold; border: 1px solid #d69e2e; }
    .badge-green { background-color: #c6f6d5; color: #1c4532; padding: 6px 12px; border-radius: 14px; font-size: 14px; font-weight: bold; border: 1px solid #38a169; }
    
    .card-grid { display: grid; grid-template-columns: 1fr; gap: 10px; font-size: 16px; color: #2d3748; margin-bottom: 14px; margin-top: 10px; }
    
    .btn-primary { background-color: #2c7a7b; color: white; border: none; min-height: 54px; padding: 14px; border-radius: 16px; font-size: 18px; width: 100%; cursor: pointer; font-weight: bold; margin-top: 12px; box-shadow: 0 4px 12px rgba(44,122,123,0.3); }
    .btn-pdf-gen { background-color: #2b6cb0; color: white; border: none; min-height: 48px; padding: 12px; border-radius: 14px; font-size: 16px; width: 100%; cursor: pointer; font-weight: bold; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(43,108,176,0.3); }
    .btn-danger { background-color: #e53e3e; color: white; border: none; padding: 10px 16px; border-radius: 12px; font-size: 14px; cursor: pointer; font-weight: bold; }
    .btn-edit { background-color: #3182ce; color: white; border: none; padding: 10px 16px; border-radius: 12px; font-size: 14px; cursor: pointer; font-weight: bold; margin-right: 8px; }
    .btn-pdf-single { background-color: #38a169; color: white; border: none; padding: 10px 16px; border-radius: 12px; font-size: 14px; cursor: pointer; font-weight: bold; margin-right: 8px; }
    .btn-back { background-color: #edf2f7; color: #2c7a7b; border: 1px solid #cbd5e0; padding: 10px 16px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 16px; display: inline-block; }
    .fab { background-color: #2c7a7b; color: white; border: none; min-height: 56px; padding: 16px; border-radius: 18px; font-size: 19px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 16px; box-shadow: 0 4px 12px rgba(44,122,123,0.3); }
    
    .nav-bar { display: flex; justify-content: space-around; background-color: #ffffff; border-radius: 22px; padding: 14px; position: fixed; bottom: 14px; left: 16px; right: 16px; font-size: 15px; text-align: center; box-shadow: 0 6px 20px rgba(0,0,0,0.15); z-index: 100; border: 1px solid #e2e8f0; }
    .nav-item-active { color: #2c7a7b; font-weight: bold; cursor: pointer; }
    .nav-item { color: #718096; cursor: pointer; }
    
    .input-field { width: 100%; min-height: 52px; padding: 12px 16px; border-radius: 14px; border: 2px solid #cbd5e0; font-size: 17px; margin-bottom: 14px; background-color: #fff; color: #1a202c; }
    .input-field:focus { border-color: #2c7a7b; outline: none; }
    .search-box { border-color: #2c7a7b; background-color: #f7fafc; }
    
    .login-box { background: white; padding: 28px; border-radius: 22px; margin-top: 30px; box-shadow: 0 6px 20px rgba(0,0,0,0.08); border: 1px solid #cbd5e0; }
    .actions-row { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 8px; margin-top: 12px; border-top: 2px solid #edf2f7; padding-top: 12px; }
    .alert-banner { background-color: #ebf8ff; border: 2px solid #63b3ed; color: #2b6cb0; padding: 14px; border-radius: 16px; font-size: 15px; margin-bottom: 18px; display: flex; justify-content: space-between; align-items: center; font-weight: 500; }
    .info-box { background-color: #e6fffa; border: 1px solid #b2f5ea; padding: 12px; border-radius: 12px; font-size: 15px; color: #234e52; margin-top: 8px; }
  </style>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">
    const SUPABASE_URL = 'https://pyijfvcpdvibocatstak.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_3aLRXF3ttPSb5WZM6p8vcw_hn1na3U1';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function calcularProximoCulto(fechaFallecimiento) {
      if (!fechaFallecimiento) return { fecha: 'N/A', detalle: 'Sin fecha' };

      const [year, month, day] = fechaFallecimiento.split('-').map(Number);
      const hoy = new Date();
      hoy.setHours(0, 0, 0, 0);

      const fechaFall = new Date(year, month - 1, day);
      fechaFall.setHours(0, 0, 0, 0);

      const hitosDias = [10, 20, 30, 40, 50];
      for (let dias of hitosDias) {
        let fechaHito = new Date(fechaFall);
        fechaHito.setDate(fechaHito.getDate() + dias);
        
        if (fechaHito >= hoy) {
          const yyyy = fechaHito.getFullYear();
          const mm = String(fechaHito.getMonth() + 1).padStart(2, '0');
          const dd = String(fechaHito.getDate()).padStart(2, '0');
          return {
            fecha: `${yyyy}-${mm}-${dd}`,
            detalle: `Día ${dias} de Elevación Espiritual`,
            esHoy: fechaHito.getTime() === hoy.getTime()
          };
        }
      }

      let proximoAniversario = new Date(hoy.getFullYear(), month - 1, day);
      if (proximoAniversario < hoy) {
        proximoAniversario.setFullYear(hoy.getFullYear() + 1);
      }

      const yyyy = proximoAniversario.getFullYear();
      const mm = String(proximoAniversario.getMonth() + 1).padStart(2, '0');
      const dd = String(proximoAniversario.getDate()).padStart(2, '0');

      return {
        fecha: `${yyyy}-${mm}-${dd}`,
        detalle: `Culto Anual de Aniversario (Sorei-Saishi)`,
        esHoy: proximoAniversario.getTime() === hoy.getTime()
      };
    }

    function reproducirSonidoAlarma() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 2.5);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 2.5);
      } catch (e) {
        console.log('Error reproducir sonido:', e);
      }
    }

    function App() {
      const [usuarioSesion, setUsuarioSesion] = React.useState(null);
      const [vista, setVista] = React.useState('inicio');
      const [solicitudes, setSolicitudes] = React.useState([]);
      const [iglesias, setIglesias] = React.useState([]);
      const [loading, setLoading] = React.useState(false);
      const [editandoRegistro, setEditandoRegistro] = React.useState(null);
      const [notificacionesActivas, setNotificacionesActivas] = React.useState(false);
      const [busqueda, setBusqueda] = React.useState('');

      const [userInput, setUserInput] = React.useState('');
      const [passInput, setPassInput] = React.useState('');

      React.useEffect(() => {
        if ("Notification" in window) {
          if (Notification.permission === "granted") {
            setNotificacionesActivas(true);
          }
        }
        const interval = setInterval(() => { verificarAlarmasDelDia(); }, 30000);
        return () => clearInterval(interval);
      }, [solicitudes]);

      function activarNotificaciones() {
        if ("Notification" in window) {
          Notification.requestPermission().then(permission => {
            if (permission === "granted") {
              setNotificacionesActivas(true);
              reproducirSonidoAlarma();
              new Notification("🔔 Notificaciones Activadas", {
                body: "Recibirás alertas a las 8:00 AM, 12:00 PM y 6:30 PM en días de culto.",
              });
            }
          });
        } else {
          alert("Este navegador no soporta notificaciones automáticas.");
        }
      }

      function verificarAlarmasDelDia() {
        if (!solicitudes.length) return;
        const ahora = new Date();
        const horaStr = `${String(ahora.getHours()).padStart(2, '0')}:${String(ahora.getMinutes()).padStart(2, '0')}`;

        const cultosHoy = solicitudes.filter(s => {
          const info = calcularProximoCulto(s.antepasados?.fecha_fallecimiento);
          return info.esHoy;
        });

        if (cultosHoy.length > 0) {
          if (horaStr === '08:00' || horaStr === '12:00' || horaStr === '18:30') {
            reproducirSonidoAlarma();
            if (Notification.permission === "granted") {
              new Notification(`⏰ ALERTA DE CULTO (${horaStr})`, {
                body: `Hoy corresponden ${cultosHoy.length} oración(es) / culto(s) de antepasados.`,
              });
            }
          }
        }
      }

      React.useEffect(() => {
        if (usuarioSesion) {
          cargarDatos();
          cargarIglesias();
        }
      }, [usuarioSesion]);

      async function iniciarSesion(e) {
        e.preventDefault();
        setLoading(true);
        const { data } = await supabase
          .from('usuarios_sistema')
          .select('*, iglesias(nombre)')
          .eq('usuario', userInput)
          .eq('password', passInput)
          .single();

        if (data) {
          setUsuarioSesion(data);
        } else {
          alert('Usuario o contraseña incorrectos');
        }
        setLoading(false);
      }

      async function cargarIglesias() {
        const { data } = await supabase.from('iglesias').select('*').order('nombre');
        if (data) setIglesias(data);
      }

      async function cargarDatos() {
        setLoading(true);
        let query = supabase
          .from('solicitudes_culto')
          .select(`
            id,
            estado_sorei_saishi,
            fecha_registro,
            iglesia_id,
            iglesias ( nombre ),
            antepasados (
              id,
              nombre_fallecido,
              fecha_fallecimiento,
              edad_fallecimiento,
              linaje,
              tipo_antepasado,
              solicitantes ( id, nombre_completo, fecha_nacimiento, tipo_persona )
            )
          `)
          .order('id', { ascending: false });

        if (usuarioSesion.rol !== 'administrador') {
          query = query.eq('iglesia_id', usuarioSesion.iglesia_id);
        }

        const { data } = await query;
        if (data) setSolicitudes(data);
        setLoading(false);
      }

      async function eliminarSolicitud(id) {
        if (window.confirm('¿Está seguro de eliminar este registro?')) {
          await supabase.from('solicitudes_culto').delete().eq('id', id);
          cargarDatos();
        }
      }

      // Función para exportar la lista completa a PDF
      function exportarPDFGeneral(datosAExportar) {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();

        doc.setFontSize(16);
        doc.text("Igreja Mundial do Messias - Registro de Cultos", 14, 15);
        doc.setFontSize(11);
        doc.text(`Reporte generado por: ${usuarioSesion.nombre}`, 14, 23);
        doc.text(`Fecha del Reporte: ${new Date().toLocaleDateString()}`, 14, 29);

        const tableColumn = ["Iglesia", "Solicitante", "Antepasado", "Condición", "F. Fallecimiento", "Próximo Culto"];
        const tableRows = [];

        datosAExportar.forEach(item => {
          const infoCulto = calcularProximoCulto(item.antepasados?.fecha_fallecimiento);
          const rowData = [
            item.iglesias?.nombre || 'N/A',
            item.antepasados?.solicitantes?.nombre_completo || 'N/A',
            item.antepasados?.nombre_fallecido || 'N/A',
            item.antepasados?.tipo_antepasado || 'Miembro',
            item.antepasados?.fecha_fallecimiento || 'N/A',
            `${infoCulto.fecha}\n(${infoCulto.detalle})`
          ];
          tableRows.push(rowData);
        });

        doc.autoTable({
          head: [tableColumn],
          body: tableRows,
          startY: 35,
          styles: { fontSize: 9 },
          headStyles: { fillColor: [44, 122, 123] }
        });

        doc.save(`Registro_Cultos_${new Date().toISOString().slice(0,10)}.pdf`);
      }

      // Función para exportar ficha individual a PDF
      function exportarPDFIndividual(item) {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const infoCulto = calcularProximoCulto(item.antepasados?.fecha_fallecimiento);

        doc.setFontSize(18);
        doc.setTextColor(26, 54, 93);
        doc.text("IGREJA MUNDIAL DO MESSIAS", 105, 20, null, null, "center");
        doc.setFontSize(14);
        doc.text("Ficha de Inscripción de Culto de Antepasados (Sorei-Saishi)", 105, 28, null, null, "center");
        
        doc.setLineWidth(0.5);
        doc.line(14, 33, 196, 33);

        doc.setFontSize(12);
        doc.setTextColor(0, 0, 0);
        
        let y = 45;
        doc.setFont(undefined, 'bold');
        doc.text("DATOS DEL REGISTRO:", 14, y);
        doc.setFont(undefined, 'normal');
        y += 8;
        doc.text(`Iglesia / Departamento: ${item.iglesias?.nombre || 'N/A'}`, 14, y);
        y += 7;
        doc.text(`Fecha de Registro en Sistema: ${item.fecha_registro ? new Date(item.fecha_registro).toLocaleString() : 'N/A'}`, 14, y);

        y += 12;
        doc.setFont(undefined, 'bold');
        doc.text("DATOS DEL SOLICITANTE:", 14, y);
        doc.setFont(undefined, 'normal');
        y += 8;
        doc.text(`Nombre Completo: ${item.antepasados?.solicitantes?.nombre_completo}`, 14, y);
        y += 7;
        doc.text(`Fecha de Nacimiento: ${item.antepasados?.solicitantes?.fecha_nacimiento}`, 14, y);
        y += 7;
        doc.text(`Condición: Miembro`, 14, y);

        y += 12;
        doc.setFont(undefined, 'bold');
        doc.text("DATOS DEL ANTEPASADO / FALLECIDO:", 14, y);
        doc.setFont(undefined, 'normal');
        y += 8;
        doc.text(`Nombre del Fallecido: ${item.antepasados?.nombre_fallecido}`, 14, y);
        y += 7;
        doc.text(`Fecha de Fallecimiento: ${item.antepasados?.fecha_fallecimiento}`, 14, y);
        y += 7;
        doc.text(`Edad al Fallecer: ${item.antepasados?.edad_fallecimiento} años`, 14, y);
        y += 7;
        doc.text(`Condición del Antepasado: ${item.antepasados?.tipo_antepasado || 'Miembro'}`, 14, y);
        y += 7;
        doc.text(`Linaje (Paterno/Esposo): ${item.antepasados?.linaje}`, 14, y);

        y += 14;
        doc.setFillColor(238, 247, 246);
        doc.rect(14, y, 182, 22, 'F');
        doc.setFont(undefined, 'bold');
        doc.setTextColor(44, 122, 123);
        doc.text(`PROGRAMACIÓN DEL PRÓXIMO CULTO / ORACIÓN:`, 18, y + 8);
        doc.setFontSize(11);
        doc.text(`Fecha: ${infoCulto.fecha} - (${infoCulto.detalle})`, 18, y + 16);

        doc.save(`Ficha_${item.antepasados?.nombre_fallecido.replace(/\s+/g, '_')}.pdf`);
      }

      // Filtrado por Búsqueda (Nombre solicitante o antepasado)
      const solicitudesFiltradas = solicitudes.filter(item => {
        const texto = busqueda.toLowerCase();
        const solNombre = item.antepasados?.solicitantes?.nombre_completo?.toLowerCase() || '';
        const antNombre = item.antepasados?.nombre_fallecido?.toLowerCase() || '';
        return solNombre.includes(texto) || antNombre.includes(texto);
      });

      if (!usuarioSesion) {
        return (
          <div class="phone-frame">
            <h2 class="title" style={{ marginTop: '20px', fontSize: '24px' }}>Gestión de Cultos</h2>
            <div class="login-box">
              <h3 style={{ fontSize: '20px', marginBottom: '18px', textAlign: 'center', color: '#1a365d' }}>Iniciar Sesión</h3>
              <form onSubmit={iniciarSesion}>
                <span class="label">Usuario:</span>
                <input class="input-field" placeholder="Escriba su usuario" value={userInput} onChange={e => setUserInput(e.target.value)} required />
                
                <span class="label">Contraseña:</span>
                <input class="input-field" type="password" placeholder="Escriba su contraseña" value={passInput} onChange={e => setPassInput(e.target.value)} required />
                
                <button class="btn-primary" type="submit" disabled={loading}>
                  {loading ? 'Verificando...' : 'INGRESAR'}
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div class="phone-frame">
          <h2 class="title">Gestión de Cultos y Antepasados</h2>

          <div class="user-card">
            <div>
              <span style={{ fontSize: '13px', color: '#4a5568', fontWeight: 'bold' }}>{usuarioSesion.rol === 'administrador' ? 'ADMINISTRADOR GENERAL' : 'RESPONSABLE LOCAL'}</span>
              <div style={{ fontWeight: 'bold', color: '#1a365d', fontSize: '17px', marginTop: '4px' }}>
                {usuarioSesion.nombre} <br/>
                <span style={{ fontSize: '14px', color: '#2c7a7b' }}>({usuarioSesion.iglesias?.nombre || 'Todas las Iglesias'})</span>
              </div>
            </div>
            <button class="btn-danger" onClick={() => setUsuarioSesion(null)}>Salir</button>
          </div>

          {!notificacionesActivas && (
            <div class="alert-banner">
              <span>🔔 Activar alarmas (8am, 12pm, 6:30pm)</span>
              <button class="btn-edit" onClick={activarNotificaciones}>Activar</button>
            </div>
          )}

          {vista === 'inicio' && (
            <>
              <h3 class="section-title">
                {usuarioSesion.rol === 'administrador' ? 'REPORTE GENERAL (TODAS LAS IGLESIAS)' : `SOLICITUDES DE ${usuarioSesion.iglesias?.nombre.toUpperCase()}`}
              </h3>

              {/* Búsqueda por Nombre / Antepasado */}
              <input 
                class="input-field search-box" 
                placeholder="🔍 Buscar por Solicitante o Antepasado..." 
                value={busqueda} 
                onChange={e => setBusqueda(e.target.value)} 
              />

              {/* Botón para exportar PDF completo */}
              <button class="btn-pdf-gen" onClick={() => exportarPDFGeneral(solicitudesFiltradas)}>
                📥 Descargar Reporte Completo PDF ({solicitudesFiltradas.length})
              </button>

              {loading ? <p style={{ fontSize: '16px', margin: '15px 0' }}>Cargando datos...</p> : solicitudesFiltradas.map((item) => {
                const infoCulto = calcularProximoCulto(item.antepasados?.fecha_fallecimiento);
                return (
                  <div key={item.id} class="card">
                    <div class="card-header">
                      <div>
                        <span class="label">Iglesia: <strong>{item.iglesias?.nombre || 'N/A'}</strong></span>
                        <div class="bold-text">{item.antepasados?.nombre_fallecido}</div>
                      </div>
                      <span class={item.estado_sorei_saishi === 'Pendiente Local' ? 'badge-yellow' : 'badge-green'}>
                        {item.estado_sorei_saishi}
                      </span>
                    </div>
                    
                    <div class="card-grid">
                      <div><span class="label">Condición Antepasado:</span><br/><strong>{item.antepasados?.tipo_antepasado || 'Miembro'}</strong></div>
                      <div><span class="label">Linaje:</span><br/><strong>{item.antepasados?.linaje}</strong></div>
                      <div><span class="label">Fecha Fallecimiento:</span><br/><strong>{item.antepasados?.fecha_fallecimiento}</strong></div>
                      <div><span class="label">Solicitante (Miembro):</span><br/><strong>{item.antepasados?.solicitantes?.nombre_completo}</strong></div>
                      <div><span class="label">Fecha Registro en Sistema:</span><br/><strong>{item.fecha_registro ? new Date(item.fecha_registro).toLocaleDateString() : 'N/A'}</strong></div>
                    </div>

                    <div class="info-box">
                      <strong>📅 Próxima Oración / Culto:</strong> <br/>
                      <span style={{ fontSize: '18px', fontWeight: 'bold', color: '#1a365d' }}>{infoCulto.fecha}</span> <br/>
                      <span style={{ fontSize: '14px', color: '#2c7a7b', fontWeight: '600' }}>({infoCulto.detalle})</span>
                    </div>

                    <div class="actions-row">
                      <button class="btn-pdf-single" onClick={() => exportarPDFIndividual(item)}>📄 PDF Ficha</button>
                      <button class="btn-edit" onClick={() => { setEditandoRegistro(item); setVista('nuevo'); }}>✏️ Editar</button>
                      {usuarioSesion.rol === 'administrador' && (
                        <button class="btn-danger" onClick={() => eliminarSolicitud(item.id)}>🗑️ Eliminar</button>
                      )}
                    </div>
                  </div>
                );
              })}

              <button class="fab" onClick={() => { setEditandoRegistro(null); setVista('nuevo'); }}>
                ➕ NUEVA SOLICITUD
              </button>
            </>
          )}

          {vista === 'nuevo' && (
            <Formulario 
              usuarioSesion={usuarioSesion} 
              iglesias={iglesias} 
              editando={editandoRegistro}
              alFinalizar={() => { setVista('inicio'); cargarDatos(); }} 
            />
          )}

          {vista === 'admin_gestion' && usuarioSesion.rol === 'administrador' && (
            <GestionAdmin iglesias={iglesias} alActualizar={cargarIglesias} />
          )}

          <div class="nav-bar">
            <div class={vista === 'inicio' ? 'nav-item-active' : 'nav-item'} onClick={() => setVista('inicio')}>🏠<br/><strong>Inicio</strong></div>
            {usuarioSesion.rol === 'administrador' && (
              <div class={vista === 'admin_gestion' ? 'nav-item-active' : 'nav-item'} onClick={() => setVista('admin_gestion')}>⚙️<br/><strong>Administración</strong></div>
            )}
          </div>
        </div>
      );
    }

    function Formulario({ usuarioSesion, iglesias, editando, alFinalizar }) {
      const [nombreSol, setNombreSol] = React.useState(editando?.antepasados?.solicitantes?.nombre_completo || '');
      const [fechaNacSol, setFechaNacSol] = React.useState(editando?.antepasados?.solicitantes?.fecha_nacimiento || '');
      
      const [nombreFall, setNombreFall] = React.useState(editando?.antepasados?.nombre_fallecido || '');
      const [fechaFall, setFechaFall] = React.useState(editando?.antepasados?.fecha_fallecimiento || '');
      const [edadFall, setEdadFall] = React.useState(editando?.antepasados?.edad_fallecimiento || '');
      const [linaje, setLinaje] = React.useState(editando?.antepasados?.linaje || '');
      const [tipoAntepasado, setTipoAntepasado] = React.useState(editando?.antepasados?.tipo_antepasado || 'Miembro');
      
      const [iglesiaId, setIglesiaId] = React.useState(editando?.iglesia_id || usuarioSesion.iglesia_id || iglesias[0]?.id);
      const [guardando, setGuardando] = React.useState(false);

      async function guardar(e) {
        e.preventDefault();
        setGuardando(true);
        try {
          if (editando) {
            await supabase.from('solicitantes').update({
              nombre_completo: nombreSol,
              fecha_nacimiento: fechaNacSol,
              tipo_persona: 'Miembro'
            }).eq('id', editando.antepasados.solicitantes.id);

            await supabase.from('antepasados').update({
              nombre_fallecido: nombreFall,
              fecha_fallecimiento: fechaFall,
              edad_fallecimiento: parseInt(edadFall),
              linaje: linaje,
              tipo_antepasado: tipoAntepasado
            }).eq('id', editando.antepasados.id);

            await supabase.from('solicitudes_culto').update({
              iglesia_id: iglesiaId
            }).eq('id', editando.id);

            alert('Registro actualizado correctamente');
          } else {
            const { data: sol } = await supabase.from('solicitantes').insert([{
              nombre_completo: nombreSol,
              fecha_nacimiento: fechaNacSol,
              tipo_persona: 'Miembro'
            }]).select().single();

            const { data: ant } = await supabase.from('antepasados').insert([{
              solicitante_id: sol.id,
              nombre_fallecido: nombreFall,
              fecha_fallecimiento: fechaFall,
              edad_fallecimiento: parseInt(edadFall),
              linaje: linaje,
              tipo_antepasado: tipoAntepasado
            }]).select().single();

            await supabase.from('solicitudes_culto').insert([{
              antepasado_id: ant.id,
              iglesia_id: usuarioSesion.rol === 'administrador' ? iglesiaId : usuarioSesion.iglesia_id,
              estado_sorei_saishi: 'Pendiente Local',
              fecha_registro: new Date().toISOString()
            }]);

            alert('Solicitud guardada con éxito');
          }
          alFinalizar();
        } catch (err) {
          alert('Error: ' + err.message);
        } finally {
          setGuardando(false);
        }
      }

      return (
        <form onSubmit={guardar}>
          <button type="button" class="btn-back" onClick={alFinalizar}>← VOLVER ATRÁS</button>
          
          <h3 style={{ fontSize: '20px', color: '#1a365d', marginBottom: '16px', fontWeight: 'bold' }}>
            {editando ? 'Editar Solicitud' : 'Nueva Solicitud'}
          </h3>

          {usuarioSesion.rol === 'administrador' && (
            <div>
              <span class="label">Asignar Iglesia:</span>
              <select class="input-field" value={iglesiaId} onChange={e => setIglesiaId(e.target.value)}>
                {iglesias.map(i => <option key={i.id} value={i.id}>{i.nombre}</option>)}
              </select>
            </div>
          )}

          <div style={{ backgroundColor: '#fff', padding: '16px', borderRadius: '16px', marginBottom: '16px', border: '1px solid #cbd5e0' }}>
            <h4 style={{ fontSize: '17px', color: '#2c7a7b', marginBottom: '12px' }}>👤 Datos del Solicitante (Miembro)</h4>
            
            <span class="label">Nombre Completo del Solicitante:</span>
            <input class="input-field" placeholder="Ej: Juan Pérez" value={nombreSol} onChange={e=>setNombreSol(e.target.value)} required />
            
            <span class="label">Fecha de Nacimiento del Solicitante:</span>
            <input class="input-field" type="date" value={fechaNacSol} onChange={e=>setFechaNacSol(e.target.value)} required />
          </div>

          <div style={{ backgroundColor: '#fff', padding: '16px', borderRadius: '16px', marginBottom: '16px', border: '1px solid #cbd5e0' }}>
            <h4 style={{ fontSize: '17px', color: '#2c7a7b', marginBottom: '12px' }}>🕊️ Datos del Antepasado / Fallecido</h4>
            
            <span class="label">Nombre del Fallecido:</span>
            <input class="input-field" placeholder="Ej: María López" value={nombreFall} onChange={e=>setNombreFall(e.target.value)} required />
            
            <span class="label">Fecha de Fallecimiento:</span>
            <input class="input-field" type="date" value={fechaFall} onChange={e=>setFechaFall(e.target.value)} required />
            
            <span class="label">Edad al Fallecer:</span>
            <input class="input-field" type="number" placeholder="Ej: 75" value={edadFall} onChange={e=>setEdadFall(e.target.value)} required />

            <span class="label">Condición del Antepasado:</span>
            <select class="input-field" value={tipoAntepasado} onChange={e=>setTipoAntepasado(e.target.value)}>
              <option value="Miembro">Miembro</option>
              <option value="Frecuentador">Frecuentador</option>
            </select>

            <span class="label">Linaje (A. Paterno / A. Esposo):</span>
            <input class="input-field" placeholder="Ej: Linaje Pérez / López" value={linaje} onChange={e=>setLinaje(e.target.value)} required />
          </div>

          <button class="btn-primary" type="submit" disabled={guardando}>
            {guardando ? 'Guardando...' : (editando ? 'GUARDAR CAMBIOS' : 'CREAR SOLICITUD')}
          </button>
        </form>
      );
    }

    function GestionAdmin({ iglesias, alActualizar }) {
      const [nuevaIglesia, setNuevaIglesia] = React.useState('');
      const [nombreResp, setNombreResp] = React.useState('');
      const [userResp, setUserResp] = React.useState('');
      const [passResp, setPassResp] = React.useState('');
      const [iglesiaRespId, setIglesiaRespId] = React.useState(iglesias[0]?.id || '');

      async function agregarIglesia(e) {
        e.preventDefault();
        await supabase.from('iglesias').insert([{ nombre: nuevaIglesia }]);
        setNuevaIglesia('');
        alert('Iglesia registrada');
        alActualizar();
      }

      async function agregarResponsable(e) {
        e.preventDefault();
        await supabase.from('usuarios_sistema').insert([{
          nombre: nombreResp,
          usuario: userResp,
          password: passResp,
          rol: 'responsable',
          iglesia_id: iglesiaRespId
        }]);
        setNombreResp(''); setUserResp(''); setPassResp('');
        alert('Responsable registrado con éxito');
      }

      return (
        <div>
          <h3 class="section-title">AGREGAR NUEVA IGLESIA</h3>
          <form onSubmit={agregarIglesia} class="card">
            <span class="label">Nombre de la Iglesia/Depto:</span>
            <input class="input-field" placeholder="Ej: Tarija" value={nuevaIglesia} onChange={e=>setNuevaIglesia(e.target.value)} required />
            <button class="btn-primary" type="submit">Agregar Iglesia</button>
          </form>

          <h3 class="section-title">AGREGAR RESPONSABLE DE IGLESIA</h3>
          <form onSubmit={agregarResponsable} class="card">
            <span class="label">Nombre Completo:</span>
            <input class="input-field" placeholder="Ej: Pedro Gonzales" value={nombreResp} onChange={e=>setNombreResp(e.target.value)} required />
            
            <span class="label">Nombre de Usuario:</span>
            <input class="input-field" placeholder="Ej: pedro_tarija" value={userResp} onChange={e=>setUserResp(e.target.value)} required />
            
            <span class="label">Contraseña:</span>
            <input class="input-field" type="password" placeholder="Escriba la contraseña" value={passResp} onChange={e=>setPassResp(e.target.value)} required />
            
            <span class="label">Asignar Iglesia:</span>
            <select class="input-field" value={iglesiaRespId} onChange={e=>setIglesiaRespId(e.target.value)}>
              {iglesias.map(i => <option key={i.id} value={i.id}>{i.nombre}</option>)}
            </select>
            <button class="btn-primary" type="submit">Crear Usuario Responsable</button>
          </form>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
