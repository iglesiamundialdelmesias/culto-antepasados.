<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Cultos y Antepasados</title>
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
    body { background-color: #f0f4f8; display: flex; justify-content: center; padding: 10px; min-height: 100vh; }
    .phone-frame { width: 100%; max-width: 450px; background-color: #eef7f6; border-radius: 25px; padding: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); position: relative; padding-bottom: 70px; min-height: 600px; }
    .title { text-align: center; font-size: 16px; color: #1a365d; margin-bottom: 12px; font-weight: bold; }
    .user-card { background-color: #ffffff; border-radius: 12px; padding: 10px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .section-title { font-size: 11px; font-weight: bold; color: #4a5568; margin-bottom: 8px; text-transform: uppercase; margin-top: 10px; }
    .card { background-color: #ffffff; border-radius: 12px; padding: 12px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
    .bold-text { font-weight: bold; font-size: 13px; color: #2d3748; }
    .label { font-size: 10px; color: #a0aec0; }
    .badge-yellow { background-color: #fefcbf; color: #744210; padding: 3px 6px; border-radius: 8px; font-size: 10px; font-weight: bold; }
    .badge-green { background-color: #c6f6d5; color: #22543d; padding: 3px 6px; border-radius: 8px; font-size: 10px; font-weight: bold; }
    .card-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; font-size: 10px; color: #4a5568; margin-bottom: 8px; }
    .btn-primary { background-color: #2c7a7b; color: white; border: none; padding: 8px; border-radius: 12px; font-size: 11px; width: 100%; cursor: pointer; font-weight: bold; margin-top: 5px; }
    .btn-danger { background-color: #e53e3e; color: white; border: none; padding: 5px 8px; border-radius: 8px; font-size: 10px; cursor: pointer; font-weight: bold; }
    .btn-edit { background-color: #3182ce; color: white; border: none; padding: 5px 8px; border-radius: 8px; font-size: 10px; cursor: pointer; font-weight: bold; margin-right: 5px; }
    .btn-back { background-color: transparent; color: #2c7a7b; border: none; font-size: 12px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
    .fab { background-color: #319795; color: white; border: none; padding: 12px; border-radius: 20px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px; }
    .nav-bar { display: flex; justify-content: space-around; background-color: #ffffff; border-radius: 15px; padding: 8px; position: absolute; bottom: 15px; left: 15px; right: 15px; font-size: 9px; text-align: center; }
    .nav-item-active { color: #2c7a7b; font-weight: bold; cursor: pointer; }
    .nav-item { color: #a0aec0; cursor: pointer; }
    .input-field { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #cbd5e0; font-size: 12px; margin-bottom: 8px; }
    .login-box { background: white; padding: 20px; border-radius: 15px; margin-top: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    .actions-row { display: flex; justify-content: flex-end; gap: 5px; margin-top: 8px; border-top: 1px solid #edf2f7; padding-top: 6px; }
    .alert-banner { background-color: #ebf8ff; border: 1px solid #90cdf4; color: #2b6cb0; padding: 8px; border-radius: 10px; font-size: 11px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">
    const SUPABASE_URL = 'https://pyijfvcpdvibocatstak.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_3aLRXF3ttPSb5WZM6p8vcw_hn1na3U1';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Sonido sintético de campana/alarma usando la API de Audio Web
    function reproducirSonidoAlarma() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // Tono C5 (Campana)
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 2.5);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.start();
        osc.stop(audioCtx.currentTime + 2.5);
      } catch (e) {
        console.log('Error reproduciendo sonido:', e);
      }
    }

    function App() {
      const [usuarioSesion, setUsuarioSesion] = React.useState(null);
      const [vista, setVista] = React.useState('inicio');
      const [solicitudes, setSolicitudes] = React.useState([]);
      const [iglesias, setIglesias] = React.useState([]);
      const [loading, setLoading] = React.useState(false);
      const [editandoRegistro, setEditandoRegistro] = React.useState(null);
      const [notificacionesActivas, setNotificacionesActivas] = React.useState(false);

      // Iniciar verificador de horas para alarmas (8:00 AM, 12:00 PM, 6:30 PM)
      React.useEffect(() => {
        if ("Notification" in window) {
          if (Notification.permission === "granted") {
            setNotificacionesActivas(true);
          }
        }

        const interval = setInterval(() => {
          verificarAlarmasDelDia();
        }, 30000); // Revisa cada 30 segundos

        return () => clearInterval(interval);
      }, [solicitudes]);

      function activarNotificaciones() {
        if ("Notification" in window) {
          Notification.requestPermission().then(permission => {
            if (permission === "granted") {
              setNotificacionesActivas(true);
              reproducirSonidoAlarma();
              new Notification("🔔 Notificaciones de Cultos Activadas", {
                body: "Recibirás alertas a las 8:00 AM, 12:00 PM y 6:30 PM en días de culto.",
              });
            }
          });
        } else {
          alert("Este navegador no soporta notificaciones automáticas.");
        }
      }

      function verificarAlarmasDelDia() {
        if (!solicitudes.length) return;

        const hoy = new Date().toISOString().split('T')[0];
        const ahora = new Date();
        const horaStr = `${String(ahora.getHours()).padStart(2, '0')}:${String(ahora.getMinutes()).padStart(2, '0')}`;

        // Hay cultos programados para hoy?
        const cultosHoy = solicitudes.filter(s => s.fecha_culto === hoy);

        if (cultosHoy.length > 0) {
          // Horarios definidos: 08:00, 12:00, 18:30
          if (horaStr === '08:00' || horaStr === '12:00' || horaStr === '18:30') {
            reproducirSonidoAlarma();
            if (Notification.permission === "granted") {
              new Notification(`⏰ ALERTA DE CULTO (${horaStr})`, {
                body: `Hoy se celebran ${cultosHoy.length} culto(s) de antepasados. Recuerde realizar la oración/sonnen.`,
              });
            }
          }
        }
      }

      React.useEffect(() => {
        if (usuarioSesion) {
          cargarDatos();
          cargarIglesias();
        }
      }, [usuarioSesion]);

      async function iniciarSesion(e) {
        e.preventDefault();
        setLoading(true);
        const { data } = await supabase
          .from('usuarios_sistema')
          .select('*, iglesias(nombre)')
          .eq('usuario', userInput)
          .eq('password', passInput)
          .single();

        if (data) {
          setUsuarioSesion(data);
        } else {
          alert('Usuario o contraseña incorrectos');
        }
        setLoading(false);
      }

      const [userInput, setUserInput] = React.useState('');
      const [passInput, setPassInput] = React.useState('');

      async function cargarIglesias() {
        const { data } = await supabase.from('iglesias').select('*').order('nombre');
        if (data) setIglesias(data);
      }

      async function cargarDatos() {
        setLoading(true);
        let query = supabase
          .from('solicitudes_culto')
          .select(`
            id,
            fecha_culto,
            estado_sorei_saishi,
            iglesia_id,
            iglesias ( nombre ),
            antepasados (
              id,
              nombre_fallecido,
              fecha_fallecimiento,
              edad_fallecimiento,
              linaje,
              solicitantes ( id, nombre_completo, fecha_nacimiento, tipo_persona )
            )
          `)
          .order('id', { ascending: false });

        if (usuarioSesion.rol !== 'administrador') {
          query = query.eq('iglesia_id', usuarioSesion.iglesia_id);
        }

        const { data } = await query;
        if (data) setSolicitudes(data);
        setLoading(false);
      }

      async function eliminarSolicitud(id) {
        if (window.confirm('¿Está seguro de eliminar este registro?')) {
          await supabase.from('solicitudes_culto').delete().eq('id', id);
          cargarDatos();
        }
      }

      if (!usuarioSesion) {
        return (
          <div class="phone-frame">
            <h2 class="title">Gestión de Cultos</h2>
            <div class="login-box">
              <h3 style={{ fontSize: '14px', marginBottom: '12px', textAlign: 'center' }}>Iniciar Sesión</h3>
              <form onSubmit={iniciarSesion}>
                <input class="input-field" placeholder="Usuario" value={userInput} onChange={e => setUserInput(e.target.value)} required />
                <input class="input-field" type="password" placeholder="Contraseña" value={passInput} onChange={e => setPassInput(e.target.value)} required />
                <button class="btn-primary" type="submit" disabled={loading}>
                  {loading ? 'Verificando...' : 'Ingresar'}
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div class="phone-frame">
          <h2 class="title">Gestión de Cultos y Antepasados</h2>

          <div class="user-card">
            <div>
              <span style={{ fontSize: '10px', color: '#666' }}>{usuarioSesion.rol === 'administrador' ? 'ADMINISTRADOR GENERAL' : 'RESPONSABLE LOCAL'}</span>
              <div style={{ fontWeight: 'bold', color: '#1a365d', fontSize: '12px' }}>
                {usuarioSesion.nombre} ({usuarioSesion.iglesias?.nombre || 'Todas las Iglesias'})
              </div>
            </div>
            <button class="btn-danger" onClick={() => setUsuarioSesion(null)}>Salir</button>
          </div>

          {!notificacionesActivas && (
            <div class="alert-banner">
              <span>🔔 Activa alarmas a las 8am, 12pm y 6:30pm</span>
              <button class="btn-edit" onClick={activarNotificaciones}>Activar</button>
            </div>
          )}

          {vista === 'inicio' && (
            <>
              <h3 class="section-title">
                {usuarioSesion.rol === 'administrador' ? 'REPORTE GENERAL (TODAS LAS IGLESIAS)' : `SOLICITUDES DE ${usuarioSesion.iglesias?.nombre.toUpperCase()}`}
              </h3>

              {loading ? <p style={{ fontSize: '12px' }}>Cargando datos...</p> : solicitudes.map((item) => (
                <div key={item.id} class="card">
                  <div class="card-header">
                    <div>
                      <span class="label">Iglesia: <strong>{item.iglesias?.nombre || 'N/A'}</strong></span>
                      <div class="bold-text">{item.antepasados?.nombre_fallecido}</div>
                    </div>
                    <span class={item.estado_sorei_saishi === 'Pendiente Local' ? 'badge-yellow' : 'badge-green'}>
                      {item.estado_sorei_saishi}
                    </span>
                  </div>
                  <div class="card-grid">
                    <div><span class="label">Linaje:</span><br/><strong>{item.antepasados?.linaje}</strong></div>
                    <div><span class="label">Solicitante:</span><br/><strong>{item.antepasados?.solicitantes?.nombre_completo}</strong></div>
                    <div><span class="label">Fecha Culto:</span><br/><strong>{item.fecha_culto}</strong></div>
                  </div>

                  <div class="actions-row">
                    <button class="btn-edit" onClick={() => { setEditandoRegistro(item); setVista('nuevo'); }}>Editar</button>
                    {usuarioSesion.rol === 'administrador' && (
                      <button class="btn-danger" onClick={() => eliminarSolicitud(item.id)}>Eliminar</button>
                    )}
                  </div>
                </div>
              ))}

              <button class="fab" onClick={() => { setEditandoRegistro(null); setVista('nuevo'); }}>
                + Nueva Solicitud
              </button>
            </>
          )}

          {vista === 'nuevo' && (
            <Formulario 
              usuarioSesion={usuarioSesion} 
              iglesias={iglesias} 
              editando={editandoRegistro}
              alFinalizar={() => { setVista('inicio'); cargarDatos(); }} 
            />
          )}

          {vista === 'admin_gestion' && usuarioSesion.rol === 'administrador' && (
            <GestionAdmin iglesias={iglesias} alActualizar={cargarIglesias} />
          )}

          <div class="nav-bar">
            <div class={vista === 'inicio' ? 'nav-item-active' : 'nav-item'} onClick={() => setVista('inicio')}>🏠<br/>Inicio</div>
            {usuarioSesion.rol === 'administrador' && (
              <div class={vista === 'admin_gestion' ? 'nav-item-active' : 'nav-item'} onClick={() => setVista('admin_gestion')}>⚙️<br/>Administración</div>
            )}
          </div>
        </div>
      );
    }

    function Formulario({ usuarioSesion, iglesias, editando, alFinalizar }) {
      const [nombreSol, setNombreSol] = React.useState(editando?.antepasados?.solicitantes?.nombre_completo || '');
      const [fechaNacSol, setFechaNacSol] = React.useState(editando?.antepasados?.solicitantes?.fecha_nacimiento || '');
      const [tipoSol, setTipoSol] = React.useState(editando?.antepasados?.solicitantes?.tipo_persona || 'Miembro');
      const [nombreFall, setNombreFall] = React.useState(editando?.antepasados?.nombre_fallecido || '');
      const [fechaFall, setFechaFall] = React.useState(editando?.antepasados?.fecha_fallecimiento || '');
      const [edadFall, setEdadFall] = React.useState(editando?.antepasados?.edad_fallecimiento || '');
      const [linaje, setLinaje] = React.useState(editando?.antepasados?.linaje || '');
      const [fechaCulto, setFechaCulto] = React.useState(editando?.fecha_culto || '');
      const [iglesiaId, setIglesiaId] = React.useState(editando?.iglesia_id || usuarioSesion.iglesia_id || iglesias[0]?.id);
      const [guardando, setGuardando] = React.useState(false);

      async function guardar(e) {
        e.preventDefault();
        setGuardando(true);
        try {
          if (editando) {
            await supabase.from('solicitantes').update({
              nombre_completo: nombreSol,
              fecha_nacimiento: fechaNacSol,
              tipo_persona: tipoSol
            }).eq('id', editando.antepasados.solicitantes.id);

            await supabase.from('antepasados').update({
              nombre_fallecido: nombreFall,
              fecha_fallecimiento: fechaFall,
              edad_fallecimiento: parseInt(edadFall),
              linaje: linaje
            }).eq('id', editando.antepasados.id);

            await supabase.from('solicitudes_culto').update({
              fecha_culto: fechaCulto,
              iglesia_id: iglesiaId
            }).eq('id', editando.id);

            alert('Registro actualizado correctamente');
          } else {
            const { data: sol } = await supabase.from('solicitantes').insert([{
              nombre_completo: nombreSol,
              fecha_nacimiento: fechaNacSol,
              tipo_persona: tipoSol
            }]).select().single();

            const { data: ant } = await supabase.from('antepasados').insert([{
              solicitante_id: sol.id,
              nombre_fallecido: nombreFall,
              fecha_fallecimiento: fechaFall,
              edad_fallecimiento: parseInt(edadFall),
              linaje: linaje
            }]).select().single();

            await supabase.from('solicitudes_culto').insert([{
              antepasado_id: ant.id,
              fecha_culto: fechaCulto,
              iglesia_id: usuarioSesion.rol === 'administrador' ? iglesiaId : usuarioSesion.iglesia_id,
              estado_sorei_saishi: 'Pendiente Local'
            }]);

            alert('Solicitud guardada con éxito');
          }
          alFinalizar();
        } catch (err) {
          alert('Error: ' + err.message);
        } finally {
          setGuardando(false);
        }
      }

      return (
        <form onSubmit={guardar}>
          <button type="button" class="btn-back" onClick={alFinalizar}>← Volver</button>
          <h3 style={{ fontSize: '14px', color: '#1a365d', marginBottom: '10px' }}>
            {editando ? 'Editar Solicitud' : 'Nueva Solicitud'}
          </h3>

          {usuarioSesion.rol === 'administrador' && (
            <div>
              <span class="label">Asignar Iglesia:</span>
              <select class="input-field" value={iglesiaId} onChange={e => setIglesiaId(e.target.value)}>
                {iglesias.map(i => <option key={i.id} value={i.id}>{i.nombre}</option>)}
              </select>
            </div>
          )}

          <input class="input-field" placeholder="Nombre Solicitante" value={nombreSol} onChange={e=>setNombreSol(e.target.value)} required />
          <div style={{ display: 'flex', gap: '5px' }}>
            <input class="input-field" type="date" value={fechaNacSol} onChange={e=>setFechaNacSol(e.target.value)} required />
            <select class="input-field" value={tipoSol} onChange={e=>setTipoSol(e.target.value)}>
              <option value="Miembro">Miembro</option>
              <option value="Frecuentador">Frecuentador</option>
            </select>
          </div>

          <input class="input-field" placeholder="Nombre del Fallecido" value={nombreFall} onChange={e=>setNombreFall(e.target.value)} required />
          <div style={{ display: 'flex', gap: '5px' }}>
            <input class="input-field" type="date" value={fechaFall} onChange={e=>setFechaFall(e.target.value)} required />
            <input class="input-field" type="number" placeholder="Edad" value={edadFall} onChange={e=>setEdadFall(e.target.value)} required />
          </div>

          <input class="input-field" placeholder="Linaje" value={linaje} onChange={e=>setLinaje(e.target.value)} required />
          <input class="input-field" type="date" value={fechaCulto} onChange={e=>setFechaCulto(e.target.value)} required />

          <button class="btn-primary" type="submit" disabled={guardando}>
            {guardando ? 'Guardando...' : (editando ? 'Guardar Cambios' : 'Crear Solicitud')}
          </button>
        </form>
      );
    }

    function GestionAdmin({ iglesias, alActualizar }) {
      const [nuevaIglesia, setNuevaIglesia] = React.useState('');
      const [nombreResp, setNombreResp] = React.useState('');
      const [userResp, setUserResp] = React.useState('');
      const [passResp, setPassResp] = React.useState('');
      const [iglesiaRespId, setIglesiaRespId] = React.useState(iglesias[0]?.id || '');

      async function agregarIglesia(e) {
        e.preventDefault();
        await supabase.from('iglesias').insert([{ nombre: nuevaIglesia }]);
        setNuevaIglesia('');
        alert('Iglesia registrada');
        alActualizar();
      }

      async function agregarResponsable(e) {
        e.preventDefault();
        await supabase.from('usuarios_sistema').insert([{
          nombre: nombreResp,
          usuario: userResp,
          password: passResp,
          rol: 'responsable',
          iglesia_id: iglesiaRespId
        }]);
        setNombreResp(''); setUserResp(''); setPassResp('');
        alert('Responsable registrado con éxito');
      }

      return (
        <div>
          <h3 class="section-title">AGREGAR NUEVA IGLESIA</h3>
          <form onSubmit={agregarIglesia} class="card">
            <input class="input-field" placeholder="Nombre de la Iglesia/Depto" value={nuevaIglesia} onChange={e=>setNuevaIglesia(e.target.value)} required />
            <button class="btn-primary" type="submit">Agregar Iglesia</button>
          </form>

          <h3 class="section-title">AGREGAR RESPONSABLE DE IGLESIA</h3>
          <form onSubmit={agregarResponsable} class="card">
            <input class="input-field" placeholder="Nombre Completo" value={nombreResp} onChange={e=>setNombreResp(e.target.value)} required />
            <input class="input-field" placeholder="Nombre de Usuario" value={userResp} onChange={e=>setUserResp(e.target.value)} required />
            <input class="input-field" type="password" placeholder="Contraseña" value={passResp} onChange={e=>setPassResp(e.target.value)} required />
            <span class="label">Asignar Iglesia:</span>
            <select class="input-field" value={iglesiaRespId} onChange={e=>setIglesiaRespId(e.target.value)}>
              {iglesias.map(i => <option key={i.id} value={i.id}>{i.nombre}</option>)}
            </select>
            <button class="btn-primary" type="submit">Crear Usuario Responsable</button>
          </form>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
