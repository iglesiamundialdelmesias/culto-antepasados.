<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Cultos y Antepasados</title>
  
  <!-- Cargar React y Supabase desde CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
    body { background-color: #f0f4f8; display: flex; justify-content: center; padding: 10px; min-height: 100vh; }
    .phone-frame { width: 100%; max-width: 400px; background-color: #eef7f6; border-radius: 25px; padding: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); position: relative; padding-bottom: 70px; }
    .title { text-align: center; font-size: 16px; color: #1a365d; margin-bottom: 12px; }
    .user-card { background-color: #ffffff; border-radius: 12px; padding: 10px; display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
    .avatar { font-size: 20px; background-color: #e2e8f0; border-radius: 50%; padding: 6px; }
    .section-title { font-size: 11px; font-weight: bold; color: #4a5568; margin-bottom: 8px; text-transform: uppercase; }
    .card { background-color: #ffffff; border-radius: 12px; padding: 12px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
    .bold-text { font-weight: bold; font-size: 13px; color: #2d3748; }
    .label { font-size: 10px; color: #a0aec0; }
    .badge-yellow { background-color: #fefcbf; color: #744210; padding: 3px 6px; border-radius: 8px; font-size: 10px; font-weight: bold; }
    .badge-green { background-color: #c6f6d5; color: #22543d; padding: 3px 6px; border-radius: 8px; font-size: 10px; font-weight: bold; }
    .card-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; font-size: 10px; color: #4a5568; }
    .horizontal-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; }
    .sorei-card { min-width: 140px; background-color: #ffffff; border-radius: 12px; padding: 10px; text-align: center; }
    .btn-primary { background-color: #2c7a7b; color: white; border: none; padding: 8px; border-radius: 12px; font-size: 11px; width: 100%; cursor: pointer; font-weight: bold; }
    .btn-back { background-color: transparent; color: #2c7a7b; border: none; font-size: 12px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
    .fab { background-color: #319795; color: white; border: none; padding: 12px; border-radius: 20px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px; }
    .nav-bar { display: flex; justify-content: space-around; background-color: #ffffff; border-radius: 15px; padding: 8px; position: absolute; bottom: 15px; left: 15px; right: 15px; font-size: 9px; text-align: center; }
    .nav-item-active { color: #2c7a7b; font-weight: bold; cursor: pointer; }
    .nav-item { color: #a0aec0; cursor: pointer; }
    .input-field { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #cbd5e0; font-size: 12px; margin-bottom: 8px; }
  </style>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">
    // Credenciales de Supabase de tus capturas
    const SUPABASE_URL = 'https://pyijfvcpdvibocatstak.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_3aLRXF3ttPSb5WZM6p8vcw_hnIna...'; // Asegúrate de colocar la clave completa de la captura
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function App() {
      const [vista, setVista] = React.useState('inicio');
      const [solicitudes, setSolicitudes] = React.useState([]);
      const [pendientesSorei, setPendientesSorei] = React.useState([]);
      const [loading, setLoading] = React.useState(true);

      React.useEffect(() => {
        cargarDatos();
      }, []);

      async function cargarDatos() {
        setLoading(true);
        const { data, error } = await supabase
          .from('solicitudes_culto')
          .select(`
            id,
            fecha_culto,
            estado_sorei_saishi,
            antepasados (
              nombre_fallecido,
              linaje,
              solicitantes ( tipo_persona )
            )
          `)
          .order('creado_en', { ascending: false });

        if (data) {
          setSolicitudes(data);
          setPendientesSorei(data.filter(s => s.estado_sorei_saishi === 'Pendiente Local'));
        }
        setLoading(false);
      }

      async function enviarASede(id) {
        const { error } = await supabase
          .from('solicitudes_culto')
          .update({ estado_sorei_saishi: 'Aprobado Sede' })
          .eq('id', id);

        if (!error) {
          alert('Solicitud enviada a la Sede Central');
          cargarDatos();
        }
      }

      return (
        <div class="phone-frame">
          <h2 class="title">Gestión de Cultos y Antepasados</h2>

          {vista === 'inicio' ? (
            <>
              <div class="user-card">
                <div class="avatar">👤</div>
                <div>
                  <span style={{ fontSize: '11px', color: '#666' }}>Bienvenido,</span>
                  <div style={{ fontWeight: 'bold', color: '#1a365d', fontSize: '13px' }}>
                    Responsable Local (Santa Cruz)
                  </div>
                </div>
              </div>

              <h3 class="section-title">SOLICITUDES RECIENTES</h3>
              {loading ? <p style={{ fontSize: '12px' }}>Cargando...</p> : solicitudes.map((item) => (
                <div key={item.id} class="card">
                  <div class="card-header">
                    <div>
                      <span class="label">Fallecido</span>
                      <div class="bold-text">{item.antepasados?.nombre_fallecido}</div>
                    </div>
                    <span class={item.estado_sorei_saishi === 'Pendiente Local' ? 'badge-yellow' : 'badge-green'}>
                      {item.estado_sorei_saishi}
                    </span>
                  </div>
                  <div class="card-grid">
                    <div><span class="label">Linaje:</span> <br/><strong>{item.antepasados?.linaje}</strong></div>
                    <div><span class="label">Tipo:</span> <br/><strong>{item.antepasados?.solicitantes?.tipo_persona}</strong></div>
                    <div><span class="label">Fecha:</span> <br/><strong>{item.fecha_culto}</strong></div>
                  </div>
                </div>
              ))}

              <h3 class="section-title">PENDIENTES SOREI-SAISHI (JAPÓN)</h3>
              <div class="horizontal-scroll">
                {pendientesSorei.length === 0 ? (
                  <p style={{ fontSize: '11px', color: '#718096' }}>No hay pendientes.</p>
                ) : pendientesSorei.map((item) => (
                  <div key={item.id} class="sorei-card">
                    <div class="bold-text">{item.antepasados?.nombre_fallecido}</div>
                    <div style={{ fontSize: '10px', color: '#555', margin: '4px 0' }}>
                      Linaje: {item.antepasados?.linaje}
                    </div>
                    <button class="btn-primary" onClick={() => enviarASede(item.id)}>
                      Enviar a Sede
                    </button>
                  </div>
                ))}
              </div>

              <button class="fab" onClick={() => setVista('nuevo')}>
                + Nueva Solicitud
              </button>
            </>
          ) : (
            <Formulario alFinalizar={() => { setVista('inicio'); cargarDatos(); }} />
          )}

          <div class="nav-bar">
            <div class={vista === 'inicio' ? 'nav-item-active' : 'nav-item'} onClick={() => setVista('inicio')}>🏠<br/>Inicio</div>
            <div class="nav-item">📋<br/>Solicitudes</div>
            <div class="nav-item">👥<br/>Antepasados</div>
            <div class="nav-item">⛩️<br/>Sorei-Saishi</div>
          </div>
        </div>
      );
    }

    function Formulario({ alFinalizar }) {
      const [nombreSol, setNombreSol] = React.useState('');
      const [fechaNacSol, setFechaNacSol] = React.useState('');
      const [tipoSol, setTipoSol] = React.useState('Miembro');
      const [nombreFall, setNombreFall] = React.useState('');
      const [fechaFall, setFechaFall] = React.useState('');
      const [edadFall, setEdadFall] = React.useState('');
      const [linaje, setLinaje] = React.useState('');
      const [fechaCulto, setFechaCulto] = React.useState('');
      const [requiereSorei, setRequiereSorei] = React.useState(false);
      const [guardando, setGuardando] = React.useState(false);

      async function guardar(e) {
        e.preventDefault();
        setGuardando(true);
        try {
          const { data: sol } = await supabase.from('solicitantes').insert([{
            nombre_completo: nombreSol,
            fecha_nacimiento: fechaNacSol,
            tipo_persona: tipoSol
          }]).select().single();

          const { data: ant } = await supabase.from('antepasados').insert([{
            solicitante_id: sol.id,
            nombre_fallecido: nombreFall,
            fecha_fallecimiento: fechaFall,
            edad_fallecimiento: parseInt(edadFall),
            linaje: linaje
          }]).select().single();

          await supabase.from('solicitudes_culto').insert([{
            antepasado_id: ant.id,
            fecha_culto: fechaCulto,
            requiere_sorei_saishi: requiereSorei,
            estado_sorei_saishi: requiereSorei ? 'Pendiente Local' : 'No Solicitado'
          }]);

          alert('¡Registro guardado con éxito!');
          alFinalizar();
        } catch (err) {
          alert('Error: ' + err.message);
        } finally {
          setGuardando(false);
        }
      }

      return (
        <form onSubmit={guardar}>
          <button type="button" class="btn-back" onClick={alFinalizar}>← Volver</button>
          <h3 style={{ fontSize: '14px', color: '#1a365d', marginBottom: '10px' }}>Nueva Solicitud</h3>
          
          <input class="input-field" type="text" placeholder="Nombre Solicitante" value={nombreSol} onChange={e=>setNombreSol(e.target.value)} required />
          <div style={{ display: 'flex', gap: '5px' }}>
            <input class="input-field" type="date" value={fechaNacSol} onChange={e=>setFechaNacSol(e.target.value)} required />
            <select class="input-field" value={tipoSol} onChange={e=>setTipoSol(e.target.value)}>
              <option value="Miembro">Miembro</option>
              <option value="Frecuentador">Frecuentador</option>
            </select>
          </div>

          <input class="input-field" type="text" placeholder="Nombre del Fallecido" value={nombreFall} onChange={e=>setNombreFall(e.target.value)} required />
          <div style={{ display: 'flex', gap: '5px' }}>
            <input class="input-field" type="date" value={fechaFall} onChange={e=>setFechaFall(e.target.value)} required />
            <input class="input-field" type="number" placeholder="Edad" value={edadFall} onChange={e=>setEdadFall(e.target.value)} required />
          </div>

          <input class="input-field" type="text" placeholder="Linaje (A. Paterno / A. Esposo)" value={linaje} onChange={e=>setLinaje(e.target.value)} required />
          <input class="input-field" type="date" value={fechaCulto} onChange={e=>setFechaCulto(e.target.value)} required />

          <label style={{ fontSize: '11px', display: 'flex', alignItems: 'center', gap: '5px', marginBottom: '10px' }}>
            <input type="checkbox" checked={requiereSorei} onChange={e=>setRequiereSorei(e.target.checked)} />
            ¿Solicita Sorei-Saishi para Japón?
          </label>

          <button class="btn-primary" type="submit" disabled={guardando}>
            {guardando ? 'Guardando...' : 'Guardar Solicitud'}
          </button>
        </form>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
